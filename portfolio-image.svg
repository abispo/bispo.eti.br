<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="500" fill="#1a1a1a"/>
  
  <!-- Decorative border -->
  <rect x="20" y="20" width="360" height="460" fill="none" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Head circle placeholder -->
  <circle cx="200" cy="120" r="50" fill="#3b82f6" opacity="0.3"/>
  
  <!-- Body placeholder -->
  <rect x="120" y="180" width="160" height="200" fill="#3b82f6" opacity="0.2" rx="10"/>
  
  <!-- Accent pattern -->
  <line x1="50" y1="50" x2="100" y2="50" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <line x1="50" y1="70" x2="80" y2="70" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  
  <!-- Placeholder text -->
  <text x="200" y="420" text-anchor="middle" fill="#666666" font-size="18" font-family="Arial, sans-serif">
    Replace with your photo
  </text>
  <text x="200" y="450" text-anchor="middle" fill="#666666" font-size="14" font-family="Arial, sans-serif">
    Recommended: 400x500px
  </text>
</svg>
